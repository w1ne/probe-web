# Vendored f89910e (webusb/nusb-0.2.7) because beriberikix/probe-rs is not writable
# from this checkout. The only behavioral change is the ST-Link interface walk in
# probe-rs/src/probe/stlink/usb_interface.rs. probe-rs-target is vendored with it
# so probe-rs-debug does not see a second copy of the chip-description types.
[workspace]
resolver = "2"
members = ["probe-rs", "probe-rs-target"]

[workspace.package]
version = "0.28.0"
edition = "2024"
documentation = "https://docs.rs/probe-rs/"
homepage = "https://github.com/probe-rs/probe-rs"
repository = "https://github.com/probe-rs/probe-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
probe-rs-target = { path = "probe-rs-target", version = "0.28.0" }
web-time = { version = "1.1.0" }
async-mutex = "1"
async-trait = "0.1"
docsplay = "0.1.1"
thiserror = "2.0.11"
anyhow = "1.0.82"

[workspace.lints.clippy]
unnecessary_self_imports = "deny"
enum_glob_use = "deny"
macro_use_imports = "deny"
